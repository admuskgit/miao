<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏方块移动</title>
  <style>
    body {
      background-color: gray;
    }

    .box {
      position: fixed;
      width: 40px;
      height: 40px;
      background-color: yellow;
      font-size: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      left: 0;
      top: 0;
    }
  </style>
</head>

<body>
  <div class="box">卒</div>
  <script>
    let box = document.querySelector(".box")
    let x = 0
    let y = 0
    let vx = 0
    let vy = 0
    let speed = 0.2
    let lastTime = null
    function ain(time) {
      let diff
      if(lastTime == null) {
        diff = 0
      } else {
        diff = time - lastTime //每次调用之间的时间间隔
      }
      console.log(diff)
      lastTime = time
      //高刷新，时间切的碎，调用多但是diff也会变小
      //低刷新，时间切的粗，调用少但是diff也会变大
      x += vx * speed * diff
      y += vy * speed * diff

      box.style.left = x + 'px'
      box.style.top = y + 'px'
      requestAnimationFrame(ain)
    }
    ain()
    let ArrowUpPressing = false
    let ArrowDownPressing = false
    let ArrowLeftPressing = false
    let ArrowRightPressing = false
    document.addEventListener('keydown', (e) => {
      if (e.key == 'Shift') {
        speed = 0.5
      } else if (e.key == 'ArrowUp') {
        vy = - 1
        ArrowUpPressing = true
      } else if (e.key == 'ArrowDown') {
        vy = 1
        ArrowDownPressing = true
      } else if (e.key == 'ArrowLeft') {
        vx = - 1
        ArrowLeftPressing = true
      } else if (e.key == 'ArrowRight') {
        vx = 1
        ArrowRightPressing = true
      }
    })
    document.addEventListener('keyup', (e) => {
      if (e.key == 'Shift') {
        speed = 0.2
      } else if (e.key == 'ArrowUp') {
        ArrowUpPressing = false
        if (ArrowDownPressing) {
          vy = 1
        } else {
          vy = 0
        }
      } else if (e.key == 'ArrowDown') {
        ArrowDownPressing = false
        if (ArrowUpPressing) {
          vy = - 1
        } else {
          vy = 0
        }
      } else if (e.key == 'ArrowLeft') {
        ArrowLeftPressing = false
        if (ArrowRightPressing) {
          vx = 1
        } else {
          vx = 0
        }
      } else if (e.key == 'ArrowRight') {
        ArrowRightPressing = false
        if (ArrowLeftPressing) {
          vx = - 1
        } else {
          vx = 0
        }
      }
    })
  </script>
</body>

</html>
