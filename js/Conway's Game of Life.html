<head>

  <style>
    body {
      background-color: gray;

    .row {
      display: flex;
      margin: 0;
    }

    input[type="checkbox"] {
      margin: 0;

</head>

<body>
  <button id="next">next</button>
  <button id="auto">auto</button>
  <button id="stop">stop</button>
  <div id="box"></div>
  <script>
    let time = null
    let box = document.querySelector("#box")
    let nextBtn = document.querySelector("#next")
    let auto = document.querySelector("#auto")
    let stop = document.querySelector("#stop")
    class lifeGame {
      constructor(h, w, grids = null) {
        this.h = h
        this.w = w
        this.grids = grids || Array(h).fill().map(() => Array(w).fill(0))
      }
      randomSeed() {
        let randomGrid = Array(this.h).fill().map(() => Array(this.w).fill(0))
        for (let i = 0; i < this.h; i++) {
          for (let j = 0; j < this.w; j++) {
            if (Math.random() < 0.5) {
              randomGrid[i][j] = 1
            }
          }
        }
        this.grids = randomGrid
        console.log(randomGrid)
      }
      live(i, j) {
        let count = 0
        for (let k = i - 1; k < i + 2; k++) {
          for (let l = j - 1; l < j + 2; l++) {
            if (k === i && l === j) continue
            count += this.grids[k]?.[l] ?? 0
          }
        }
        return count
      }
      nextGrids() {
        let nextGrid = Array(this.h).fill().map(() => Array(this.w).fill(0))
        for (let i = 0; i < this.h; i++) {
          for (let j = 0; j < this.w; j++) {
            let live = this.live(i, j)
            let old = this.grids[i][j]
            if (old === 0) {
              if(live === 3) {
                nextGrid[i][j] = 1
              }
            } else{
              if(live < 2 || live > 3) {
                nextGrid[i][j] = 0
              } else {
                nextGrid[i][j] = 1
              }
            }
          }
        }
        this.grids = nextGrid
        return this.grids
      }
    }
    nextBtn.addEventListener("click", () => {
      
    })
    auto.addEventListener("click", () => {
      
    })
    stop.addEventListener("click", () => {
      
    })
  </script>

</body>

</html>
