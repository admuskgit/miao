<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A JavaScript workbench</title>
</head>
<style>
  body {
    background-color: gray;
  }
</style>

<body>
  <button onclick="runCode()" style="width: 60px;">RUN</button>
  <div style="display: flex;">
    <textarea name="" id="codeInput" style="width: 300px;"></textarea>
    <div id="output" style="border: 1px solid red; height: 400px; width: 300px;box-sizing: border-box;"></div>
  </div>
  <script>
    let textarea = document.querySelector("#codeInput")
    let output = document.querySelector('#output')
    function runCode() {
      let userCode = textarea.value
      if (!userCode) {
        output.textContent = "请输入代码"
        return
      }
      try {
        let evalAndReturn = eval(userCode)
        output.textContent = String(evalAndReturn)
      } catch (error) {
        output.textContent = String(error)
      }
    }
  </script>
</body>

</html>
