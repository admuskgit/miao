<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>note-taking application</title>
  <style>
    body {
      background-color: gray;
    }
  </style>
</head>

<body>
  <div>
    <div style="display: flex;">
      <button id="createBtn" style="cursor: pointer;">新建笔记</button>
      <select name="notes" id="noteSelect" style="width: 70px;padding-right: 18px;"></select>
      <div style="display: flex;">
        <label for="fileInput" style="background-color: red;">导入</label>
        <input type="file" name="" id="fileInput" style="display: none;">
        <label for="" onclick="exportNotes()" style="background-color: tan;">导出</label>
      </div>
    </div>
    <textarea name="content" id="contentArea" style="width: 200px;height: 100px;"></textarea>
  </div>
  <script>
    let createBtn = document.getElementById('createBtn')
    let noteSelect = document.getElementById('noteSelect')
    let contentArea = document.getElementById('contentArea')
    let fileInput = document.querySelector('#fileInput')
    let notes = []
    let currentId = null
    function loadStorage() {
      let data = localStorage.getItem('notes')
      if (!data) {
        notes = []
      } else {
        notes = JSON.parse(data)
      }
      return notes
    }
    function renderAddToSelect() {
      let notes = loadStorage()
      noteSelect.innerHTML = ''
      notes.forEach(item => {
        addToSelect(item.name, item.id)
      })
    }
    function saveToStorage(dat) {
      localStorage.setItem('notes', JSON.stringify(dat))
      renderAddToSelect()
    }
    function addToSelect(name, id) {
      let opt = document.createElement('option')
      opt.value = id
      opt.textContent = name
      noteSelect.appendChild(opt)
    }
    function importNotes(e) {
      let file = e.target.files[0]
      if (!file) return
      let read = new FileReader()
      read.onload = event => {
        let da = JSON.parse(event.target.result)
        saveToStorage(da)
      }
      read.readAsText(file)
      e.target.value = ""
    }
    function exportNotes() {
      let arr = loadStorage()
      let text = JSON.stringify(arr)
      let blob = new Blob([text], { type: 'application/json' })
      let a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = "note.json"
      a.click()
    }
    loadStorage()
    renderAddToSelect()
    if (notes.length > 0) {
      let firstId = Number(noteSelect.options[0].value)
      let target = notes.find(item => item.id == firstId)
      currentId = firstId
      contentArea.value = target.content
    }
    createBtn.addEventListener('click', function () {
      let noteName = prompt('请输入日记名字')
      if (!noteName) {
        return
      }
      let newNote = {
        id: Date.now(),
        name: noteName,
        content: "",
      }
      notes.push(newNote)
      saveToStorage(notes)
      renderAddToSelect()
      noteSelect.value = newNote.id
      currentId = newNote.id
      contentArea.value = ''
    })
    noteSelect.addEventListener('change', function () {
      let selectId = Number(noteSelect.value)
      let target = notes.find(note => note.id === selectId)
      currentId = selectId
      contentArea.value = target.content
    })
    contentArea.addEventListener('input', function () {
      if (currentId == null) {
        return
      }
      let target = notes.find(note => note.id === currentId)
      target.content = contentArea.value
      saveToStorage(notes)
    })
    fileInput.addEventListener('change', function (e) {
      importNotes(e)
    })
  </script>
</body>

</html>
