<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocompletion</title>
  <style>
    body {
      background-color: gray;
    }

    div {
      position: relative;
    }

    #selectList {
      display: none;
      list-style: none;
      margin: 0;
      padding: 0;
      position: absolute;
      left: 0;
    }
    #selectList li {
      margin: 0;
      padding: 2px 2px;
      border: 1px solid greenyellow;
    }
    #selectList li:hover {
      background-color: orange;
    }
  </style>
</head>

<body>
  <div>
    <input type="text" name="" id="input">
    <ul name="" id="selectList"></ul>
  </div>

  <script>
    let list = ["acgsdgre", "aasfafa", "swUKYSD", "sSsa", "zasfaa", "xsfafa", "dasfaa", "cafafa", "easfafa", "zfafa", "xasafa", "dafafa", "casfafa", "easafa", "zafaf", "xasfaf", "dasfafa", "casfaf", "easfaoa"]
    let input = document.querySelector("#input")
    let select = document.querySelector("#selectList")
    function getMatchs(text) {
      if (!text) return []
      return list.filter(item => item.startsWith(text))
    }
    function renderList(matches) {
      select.innerHTML = ""
      if (matches === 0) {
        select.style.display = "none"
        return
      }
      select.style.display = "block"
      select.style.cursor = "pointer"
      matches.forEach(element => {
        let li = document.createElement("li")
        li.textContent = element
        li.onclick = () => {
          input.value = li.textContent
          select.style.display = "none"
        }
        select.appendChild(li)
      });
    }
    input.addEventListener("input", (e) => {
      let currentValue = e.target.value
      let lowerValue = currentValue.toLowerCase()
      let matches = getMatchs(lowerValue)
      renderList(matches)
    })
  </script>
</body>

</html>
