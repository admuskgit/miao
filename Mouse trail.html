<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse trail</title>
  <style>
    body {
      background: gray;
    }

    div {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #00ffcc;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div></div>
  <script>
    let trails = []
    let index = 0
    let lastX = 0
    let lastY = 0
    for(let i = 0; i < 20; i++) {
      let div = document.createElement("div")
      document.body.appendChild(div)
      trails.push(div)
    }
    document.addEventListener("mousemove", (e) => {
      let x = e.clientX
      let y = e.clientY
      let l = Math.sqrt(Math.pow(x - lastX, 2) + Math.pow(y - lastY, 2))
      if(l < 15) {
        return
      }
      let point = trails[index]
      point.style.left = x + "px"
      point.style.top = y + "px"
      lastX = x
      lastY = y
      index++
      if(index >= 20) {
        index = 0
      }
    })
  </script>
</body>

</html>
